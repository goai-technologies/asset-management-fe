version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: goai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goai_assets
    volumes:
      - goai_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goai_assets"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goai_pg_data:
