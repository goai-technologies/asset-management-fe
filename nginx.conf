server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # TanStack Start SPA mode emits the app shell as _shell.html (not index.html);
    # every route falls back to it and the router takes over client-side.
    index _shell.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Caching disabled everywhere — every request re-fetches from the server.
    add_header Cache-Control "no-store" always;
    etag off;
    if_modified_since off;
    add_header Last-Modified "" always;

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
